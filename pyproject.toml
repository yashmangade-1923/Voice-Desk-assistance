[project]
name = "voice-desktop-assistant"
version = "1.0.0"
description = "Modular Windows Voice Assistant (Jenny) with system controls, productivity automation, and AI reasoning"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "speechrecognition>=3.14.0",
    "pyaudio>=0.2.14",
    "pyttsx3>=2.90",
    "pycaw>=20240210",
    "comtypes>=1.4.0",
    "pyautogui>=0.9.54",
    "psutil>=5.9.8",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "python-dotenv>=1.0.1",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
